[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cassy-fatigue"
dynamic = ["version"]
description = "Nodal fatigue post-processing of Ansys results using CASSY design-code rules"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "F4E engineering analyses unit" }]
# pandas>=3 (required by cassy-f4e) needs Python 3.11.
requires-python = ">=3.11"
keywords = ["fatigue", "ansys", "dpf", "fem", "design codes", "RCC-MRx", "SDC-IC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ansys-dpf-core>=0.16.3,<0.17",
    "cassy-f4e>=3.3.2",  # first release with array support
    "numpy",
    "pyvista",
    "PySide6>=6.6",  # GUI (installed by default: analysts use it almost always)
    "pyvistaqt>=0.11",  # 3D widget of the Results tab
    "PyYAML>=6.0",
]

[project.urls]
Documentation = "https://fusion4energy.github.io/cassy-fatigue/"
Repository = "https://github.com/Fusion4Energy/cassy-fatigue"
Issues = "https://github.com/Fusion4Energy/cassy-fatigue/issues"

[project.scripts]
cassy-fatigue = "cassy_fatigue.cli:main"

[project.gui-scripts]
cassy-fatigue-gui = "cassy_fatigue.cli:gui_main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-qt>=4",
    "ruff==0.17.4",  # pinned: bump deliberately, then re-run ruff check --fix and ruff format
    "twine>=5",
]
mapdl = ["ansys-mapdl-core>=0.74.1"]
docs = ["zensical"]

[tool.setuptools_scm]
# Version from the Git tag (vX.Y.Z); untagged commits get a .devN version.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cassy_fatigue.gui" = ["logo.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # import sorting (isort rules)

[tool.ruff.lint.isort]
known-first-party = ["cassy_fatigue"]
